<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell2 — Basic List</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    .item { padding: 16px; border: 1px solid #e2e2e2; border-radius: 10px; margin-bottom: 12px; }
    .item h3 { margin: 0 0 4px; }
    .item p { margin: 0; color: #555; }
    .count { color: #888; font-size: 14px; margin-bottom: 16px; }
    .empty, .error { display: none; padding: 16px; border-radius: 10px; }
    .empty { background: #f4f4f4; color: #666; }
    .error { background: #fdecea; color: #b3261e; }
  </style>
</head>
<body>
  <h1>Places</h1>

  <!--
    Replace YOUR_SHEET_ID with your published sheet's ID and "Places" with
    the tab name. Each [data-cell2-item] is cloned once per row.
  -->
  <div data-cell2-list
       data-cell2-id="YOUR_SHEET_ID"
       data-cell2-sheet="Places"
       data-cell2-sort-col="Name"
       data-cell2-sort-dir="asc">

    <p class="count"><span data-cell2-count>0</span> places</p>

    <div class="item" data-cell2-item>
      <h3 data-cell2-field="Name"></h3>
      <p data-cell2-field="Description"></p>
    </div>

    <div class="empty" data-cell2-empty>No places found.</div>
    <div class="error" data-cell2-error>
      Couldn't load data: <span data-cell2-field="message"></span>
    </div>
  </div>

  <script src="../cell2-cms.js"></script>
</body>
</html>
