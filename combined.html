<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell2 — List + Map</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
    .list { max-height: 560px; overflow: auto; }
    .item { padding: 12px 14px; border: 1px solid #e2e2e2; border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
    .item:hover { border-color: #999; }
    .item h3 { margin: 0 0 2px; font-size: 15px; }
    .item p { margin: 0; color: #666; font-size: 13px; }
    .count { color: #888; font-size: 14px; margin-bottom: 8px; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Directory</h1>
  <p class="count"><span data-cell2-count>0</span> entries</p>

  <div class="layout">

    <!-- LIST — linked to the map by data-cell2-map-ref -->
    <div class="list"
         data-cell2-list
         data-cell2-id="YOUR_SHEET_ID"
         data-cell2-sheet="Places"
         data-cell2-map-ref="dir-map"
         data-cell2-sort-col="Name">
      <div class="item" data-cell2-item>
        <h3 data-cell2-field="Name"></h3>
        <p data-cell2-field="Category"></p>
      </div>
    </div>

    <!-- MAP — id matches the list's map-ref -->
    <div data-cell2-map-wrapper
         data-cell2-map-id="dir-map"
         data-cell2-id="YOUR_SHEET_ID"
         data-cell2-sheet="Places"
         data-cell2-col-name="Name">
      <div data-cell2-map
           data-cell2-map-tiles="carto-light"
           data-cell2-map-center="39.8,-98.6"
           data-cell2-map-zoom="4"
           style="height:560px; border-radius:12px; overflow:hidden;"></div>
      <div data-cell2-map-card>
        <strong data-cell2-field="Name"></strong>
      </div>
    </div>

  </div>

  <!-- both scripts share one cache and the _config sheet -->
  <script src="../cell2-cms.js"></script>
  <script src="../cell2-map.js"></script>
</body>
</html>
